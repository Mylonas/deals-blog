name: Update Fuel Prices

# NOT scheduled. The old government endpoint
# (eforms.eservices.cyprus.gov.cy/MCIT/MCIT/PetroleumPrices) was retired; the
# live data moved to https://petroleumprices.meci.gov.cy/ which gates every
# price query behind a CAPTCHA, so unattended scraping is no longer possible.
# The script now detects this and exits cleanly, keeping the last saved prices.
# Left as workflow_dispatch only; re-enable a schedule if a non-CAPTCHA source
# (e.g. the weekly "Δελτία Τιμών Καυσίμων" PDF bulletin) is wired up.
on:
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # needed to dispatch deploy.yml after data update
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch and update fuel prices
        run: node scripts/update-fuel-prices.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: auto-update fuel prices $(date +'%Y-%m-%d %H:%M UTC')" \
            posts/en/cheapest-petrol-stations-cyprus.md \
            posts/el/cheapest-petrol-stations-cyprus.md \
            posts/ru/cheapest-petrol-stations-cyprus.md \
            src/data/fuel-prices.json \
            src/data/fuel-price-history.json
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
