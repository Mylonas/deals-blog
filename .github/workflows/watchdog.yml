name: Watchdog - Auto-heal stale data

# Silent self-healing only. This job re-triggers a workflow whose data has gone
# stale and tells nobody — it used to open a GitHub Issue after three
# consecutive failures, which meant an email long before one was wanted.
#
# Notification is now a single channel with a single threshold: stale-alert.yml
# opens an issue only when a file is more than 7 days old. Nothing in this
# workflow should ever generate mail.
on:
  schedule:
    - cron: "30 */2 * * *"   # every 2 hours, offset from data crons (which run on :00)
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # re-trigger workflows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check data freshness and re-trigger stale workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Run watchdog - stderr = human log, stdout = stale workflow filenames
          node scripts/watchdog.mjs 1>/tmp/stale-workflows.txt

          if [ ! -s /tmp/stale-workflows.txt ]; then
            echo "All data sources are healthy."
            exit 0
          fi

          echo "Stale workflows detected — re-triggering:"
          cat /tmp/stale-workflows.txt

          while IFS= read -r workflow; do
            echo "-> Re-triggering $workflow"
            gh workflow run "$workflow" || echo "   (dispatch failed; stale-alert.yml reports it if it persists)"
            sleep 5
          done < /tmp/stale-workflows.txt
