name: Update Supermarket Deals

# Runs once daily at 06:00 UTC via GitHub's schedule, like every other data
# workflow in this repo. The Cloudflare Worker (workers/cron-trigger) no longer
# dispatches this workflow — its daily dispatch never fired, which left the
# deals data stale.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-supermarket-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # ~80 min of real work at e-kalathi's current speed (476 products, 2 workers,
    # ~20s per history fetch). Without a cap this job inherits the 6h default: on
    # 2026-07-25 it ran 4h14m against a slow endpoint and was killed before it
    # could commit anything. Fail in two hours instead of burning an afternoon.
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch cheapest supermarket products
        run: node scripts/update-supermarket-deals.mjs

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update supermarket deals $(date +'%Y-%m-%d')" \
            src/data/supermarket-deals.json \
            src/data/product-price-history.json
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
