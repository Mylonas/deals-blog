name: Update Supermarket Deals

# NOT scheduled. update-price-history-sharded.yml already runs this same script
# as its "Recompute deals and all-time lows" step, in the one place where the
# ordering is correct: after the shards have refreshed the price history the
# deals are computed from.
#
# This used to also run standalone at 06:00, 90 minutes before the sharded job.
# That was duplicated work computed from a stale cache, and it caused a real
# false alarm — the 06:00 run left nothing for the 07:30 run to update, and the
# freshness guard read "0 updated" as total failure.
#
# Kept dispatch-only as a manual recovery path: run it by hand to rebuild deals
# from the current cache without waiting for, or re-running, the shards.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-pull every product's FULL history instead of only the days since its cached asOf. Serial and slow (~1h for the whole catalogue) — prefer the sharded workflow's force input, which spreads the same work over 10 runners."
        type: boolean
        default: false

concurrency:
  group: update-supermarket-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Measured 2026-07-26 against a cache 18 days stale: ~99 products/hour, so a
    # catch-up run needs ~5h; steady-state daily deltas are far quicker. The cap
    # exists to bound a pathological run, not to cut a normal one short — the
    # step below is what actually stops work, and it lets the commit still run.
    timeout-minutes: 270
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # continue-on-error is the point: the history cache checkpoints every 50
      # products, so a run that runs out of time has still made real progress
      # for the next one. Without this a timeout kills the job before the
      # commit step and the work is discarded — which is exactly how this
      # workflow lost 17 days of updates.
      - name: Fetch cheapest supermarket products
        run: node scripts/update-supermarket-deals.mjs
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        timeout-minutes: 240
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update supermarket deals $(date +'%Y-%m-%d')" \
            src/data/supermarket-deals.json \
            src/data/product-price-history.json
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
