name: Update Souvlaki Prices — Foody (every 2 days)

# Foody gap scraper. Runs after the Wolt (06:30) and Bolt (09:30) scans so the
# gap filter sees both and only opens menus for souvlaki venues neither covers.
# Foody has no open menu API, so this drives a headless browser (Playwright)
# and reads each venue's JSON-LD menu. It checkpoints per venue and carries
# failed venues over, so a partial run still produces a valid merge.
on:
  schedule:
    # 11:00, after that morning's Wolt scan (06:30). It does NOT follow the same
    # day's Bolt scan: Bolt runs for five hours and, now that the Bolt pair is
    # serialised, this dataset's Bolt scan does not even start until about 14:00.
    # The gap filter therefore reads the previous cycle's Bolt coverage, which is
    # fine — it is which venues Bolt covers that matters, and that barely moves
    # between cycles. Worst case the filter opens a few menus Bolt would have
    # covered, and the run takes about a minute either way.
    - cron: "0 11 */2 * *" # 11:00 UTC every 2 days
  workflow_dispatch:

# Shared with update-coffee-prices-foody.yml so the two Playwright scrapes never
# drive Foody at once. They cannot collide today — each finishes in about a minute
# and they start an hour apart — but the job is capped at 120 minutes, and a scan
# drifting anywhere near that would overlap its sibling. Free insurance.
concurrency:
  group: vendor-foody
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write # needed to dispatch deploy.yml after data update

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape Foody gap venues and merge platforms
        run: node scripts/update-souvlaki-prices-foody.mjs
        timeout-minutes: 90
        continue-on-error: true # partial scrapes still produce a valid merge

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update souvlaki prices from Foody $(date +'%Y-%m-%d')" \
            src/data/souvlaki-prices-foody.json \
            src/data/souvlaki-prices.json
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
