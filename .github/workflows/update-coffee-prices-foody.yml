name: Update Coffee Prices — Foody (every 2 days)

# Foody coffee gap scraper. Runs after the Wolt (06:00) and Bolt (09:00) scans
# so the gap filter sees both and only opens menus for cafés neither covers.
# Foody has no open menu API, so this drives a headless browser (Playwright)
# and reads each venue's JSON-LD menu. It checkpoints per venue and carries
# failed venues over, so a partial run still produces a valid merge.
on:
  schedule:
    # 12:00, after that morning's Wolt scan (06:00). It does NOT follow the same
    # day's Bolt scan — that starts at 09:00 and runs a full five hours, so it is
    # still going. The gap filter reads the previous cycle's Bolt coverage, which
    # is fine: which venues Bolt covers barely moves between cycles.
    - cron: "0 12 */2 * *" # 12:00 UTC every 2 days
  workflow_dispatch:

# Shared with update-souvlaki-prices-foody.yml — see the note there. Keeps the two
# headless-browser scrapes off Foody simultaneously if either ever slows towards
# its 120-minute cap.
concurrency:
  group: vendor-foody
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write # needed to dispatch deploy.yml after data update

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape Foody gap cafés and merge platforms
        run: node scripts/update-coffee-prices-foody.mjs
        timeout-minutes: 90
        continue-on-error: true # partial scrapes still produce a valid merge

      - name: Regenerate markdown posts
        run: node scripts/update-coffee-prices.mjs

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update coffee prices from Foody $(date +'%Y-%m-%d')" \
            src/data/coffee-prices-foody.json \
            src/data/coffee-prices.json \
            posts/en/cheapest-coffee-nicosia.md \
            posts/el/cheapest-coffee-nicosia.md \
            posts/ru/cheapest-coffee-nicosia.md
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
