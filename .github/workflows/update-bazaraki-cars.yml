name: Update Bazaraki Cars (manual)

# NOT scheduled. Bazaraki's Cloudflare protection serves its managed challenge
# to every client from a datacenter IP — curl, stealth Chromium and fetch alike
# — so this cannot run on the Actions runners. The nightly schedule that used to
# live here failed at clearCloudflare on every run from 2026-07-24 while
# reporting the failure to nobody, and the car data silently froze at 2026-07-23.
#
# The scrape now runs on the laptop:  npm run cars:local
# then commit src/data/bazaraki-cars.json as normal.
#
# Kept dispatch-only so the job can still be triggered by hand if the block ever
# lifts, or from a self-hosted runner on a residential connection.
on:
  workflow_dispatch:

concurrency:
  group: update-bazaraki-cars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci


      - name: Scrape Bazaraki cars
        run: node scripts/update-bazaraki-cars.mjs
        timeout-minutes: 45

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update bazaraki cars $(date +'%Y-%m-%d')" \
            src/data/bazaraki-cars.json
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
