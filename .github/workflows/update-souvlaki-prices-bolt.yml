name: Update Souvlaki Prices — Bolt (every 2 days)

# Bolt Food scan. Runs after the same day's Wolt scan (06:30) so the merge sees
# fresh data from both platforms — the cron is day-of-month based, not weekly, so
# there is no fixed weekday. Bolt's API rate-limits hard (~5 requests bursts),
# so the scan is single-threaded and paced — expect it to take hours. The
# script checkpoints per venue and carries failed venues over, so even a
# timed-out run commits useful data.
on:
  schedule:
    # 09:30, half an hour after the coffee Bolt scan at 09:00, so the two do not
    # start their bursts together. Note this only staggers the START: both scans
    # can run up to 5 hours, so they still overlap for most of it. Serialising
    # them properly needs a shared concurrency group, not a cron offset.
    - cron: "30 9 */2 * *" # 09:30 UTC every 2 days, after the Wolt scan at 06:30
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write # needed to dispatch deploy.yml after data update

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Scan Bolt Food and merge platforms
        run: node scripts/update-souvlaki-prices-bolt.mjs
        timeout-minutes: 300
        continue-on-error: true # partial scans still produce a valid merge

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update souvlaki prices from Bolt $(date +'%Y-%m-%d')" \
            src/data/souvlaki-prices-bolt.json \
            src/data/souvlaki-prices.json
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
