name: Update Coffee Prices — Bolt (every 2 days)

# Bolt Food coffee scan. Runs after the same day's Wolt scan (06:00) so the merge
# sees fresh data from both platforms — the cron is day-of-month based, not
# weekly, so there is no fixed weekday. Bolt's API rate-limits hard (~5 request
# bursts), so the scan is single-threaded and paced — expect it to take hours.
# The script checkpoints per venue and carries failed venues over, so even a
# timed-out run commits useful data.
on:
  schedule:
    - cron: "0 9 */2 * *" # 09:00 UTC every 2 days, after the Wolt scan at 06:00
  workflow_dispatch:

# Shared with update-souvlaki-prices-bolt.yml: both scan Bolt Food, and each one
# uses its entire 300-minute budget every time (measured 300.4 and 300.5 minutes
# on 2026-08-07 — the pacing the rate limiter forces means they always hit the
# cap). Starting them 30 minutes apart therefore left them hammering Bolt
# together for four and a half hours; only a shared group actually separates
# them. The second run waits instead of starting, so the pair takes ~10 hours
# end to end.
#
# cancel-in-progress is false because the queued scan is work we still want, not
# a superseded duplicate — cancelling it would silently skip a whole cycle for
# one of the two datasets.
concurrency:
  group: vendor-bolt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write # needed to dispatch deploy.yml after data update

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Scan Bolt Food and merge platforms
        run: node scripts/update-coffee-prices-bolt.mjs
        timeout-minutes: 300
        continue-on-error: true # partial scans still produce a valid merge

      - name: Regenerate markdown posts
        run: node scripts/update-coffee-prices.mjs

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update coffee prices from Bolt $(date +'%Y-%m-%d')" \
            src/data/coffee-prices-bolt.json \
            src/data/coffee-prices.json \
            posts/en/cheapest-coffee-nicosia.md \
            posts/el/cheapest-coffee-nicosia.md \
            posts/ru/cheapest-coffee-nicosia.md
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
