name: Update Coffee Prices — Bolt (every 2 days)

# Bolt Food coffee scan. Runs after the Monday Wolt scan so the merge sees
# fresh data from both platforms. Bolt's API rate-limits hard (~5 request
# bursts), so the scan is single-threaded and paced — expect it to take hours.
# The script checkpoints per venue and carries failed venues over, so even a
# timed-out run commits useful data.
on:
  schedule:
    - cron: "0 9 */2 * *" # 09:00 UTC every 2 days, after the Wolt scan at 06:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write # needed to dispatch deploy.yml after data update

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Scan Bolt Food and merge platforms
        run: node scripts/update-coffee-prices-bolt.mjs
        timeout-minutes: 300
        continue-on-error: true # partial scans still produce a valid merge

      - name: Regenerate markdown posts
        run: node scripts/update-coffee-prices.mjs

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-data.sh "chore: update coffee prices from Bolt $(date +'%Y-%m-%d')" \
            src/data/coffee-prices-bolt.json \
            src/data/coffee-prices.json \
            posts/en/cheapest-coffee-nicosia.md \
            posts/el/cheapest-coffee-nicosia.md \
            posts/ru/cheapest-coffee-nicosia.md
      - name: Trigger Cloudflare redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
