name: Update Coffee Prices

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update coffee prices
        run: node scripts/update-coffee-prices.mjs

      - name: Commit and push
        run: |
          COMMIT_NAME="github-actions[bot]" \
          COMMIT_EMAIL="github-actions[bot]@users.noreply.github.com" \
          bash scripts/ci/commit-data.sh "chore: update coffee prices" \
            src/data/coffee-prices.json \
            posts/en/cheapest-coffee-nicosia.md \
            posts/el/cheapest-coffee-nicosia.md \
            posts/ru/cheapest-coffee-nicosia.md