name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:   # allow cron workflows to trigger a rebuild after data updates

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_NAME: DealsHub
          # Canonical origin for canonicals/sitemap/robots/OG. Set the SITE_URL
          # repo variable (gh variable set SITE_URL -b https://example.com) to
          # move the site to a custom domain; no code change needed.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://mouxti.com' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=deals-blog --branch=master
